name: Build England Valhalla routing test

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - ".github/workflows/build-uk-routing-data.yml"
      - "tools/build-uk-valhalla.sh"
      - "tools/assemble_routing_graph.py"
      - "tools/tests/test_assemble_routing_graph.py"
      - "tools/build-uk-map-layer.sh"
      - "tools/build-uk-postcode-index.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-uk-routing-data.yml"
      - "tools/build-uk-valhalla.sh"
      - "tools/assemble_routing_graph.py"
      - "tools/tests/test_assemble_routing_graph.py"
      - "tools/build-uk-map-layer.sh"
      - "tools/build-uk-postcode-index.py"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the validated graph assets as a GitHub prerelease"
        required: true
        type: boolean
        default: false
      licence_review_confirmed:
        description: "Human licence and attribution review completed"
        required: true
        type: boolean
        default: false
      independent_validation_confirmed:
        description: "Independent clean-machine download and assembly completed"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: england-valhalla-routing-build
  cancel-in-progress: false

jobs:
  validate:
    name: Validate routing builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and routing assembler tests
        run: |
          bash -n tools/build-uk-valhalla.sh
          bash -n tools/build-uk-map-layer.sh
          python3 -m py_compile tools/build-uk-postcode-index.py tools/tests/test_uk_postcode_index.py tools/assemble_routing_graph.py tools/tests/test_assemble_routing_graph.py
          python3 -m unittest discover -s tools/tests -p 'test_assemble_routing_graph.py'

  build-routing:
    name: Build and route-test England graph
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim temporary disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          docker system prune --all --force
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean
          df -h "$RUNNER_TEMP"
      - name: Build Valhalla graph and validate Liverpool-to-Manchester route
        env:
          DATA_DIR: ${{ runner.temp }}/tomos-england-valhalla
          OUTPUT_DIR: ${{ github.workspace }}/dist/england-routing
        run: bash tools/build-uk-valhalla.sh
      - name: Verify graph manifest, every part and per-asset release limits
        run: |
          set -Eeuo pipefail
          test -s dist/england-routing/england-routing.metadata.json
          test -s dist/england-routing/england-routing.manifest.json
          python3 -m json.tool dist/england-routing/england-routing.metadata.json >/dev/null
          python3 -m json.tool dist/england-routing/england-routing.manifest.json >/dev/null
          python3 tools/assemble_routing_graph.py \
            --manifest dist/england-routing/england-routing.manifest.json \
            --parts-dir dist/england-routing
          part_count="$(find dist/england-routing -maxdepth 1 -type f -name 'tiles.tar.part-*' | wc -l)"
          if (( part_count < 1 || part_count > 6 )); then
            echo "::error::Expected 1-6 routing parts for separate review artifacts; found $part_count."
            exit 1
          fi
          for asset in dist/england-routing/*; do
            test -s "$asset"
            size="$(stat -c '%s' "$asset")"
            if (( size >= 2000000000 )); then
              echo "::error::Asset $asset exceeds the configured 2 GB GitHub Release limit."
              exit 1
            fi
          done
      - name: Upload routing part 1 for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-part-0001
          path: dist/england-routing/tiles.tar.part-0001
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload routing part 2 for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-part-0002
          path: dist/england-routing/tiles.tar.part-0002
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload routing part 3 for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-part-0003
          path: dist/england-routing/tiles.tar.part-0003
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload routing part 4 for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-part-0004
          path: dist/england-routing/tiles.tar.part-0004
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload routing part 5 for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-part-0005
          path: dist/england-routing/tiles.tar.part-0005
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload routing part 6 for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-part-0006
          path: dist/england-routing/tiles.tar.part-0006
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload routing metadata and support databases
        uses: actions/upload-artifact@v4
        with:
          name: tomos-england-routing-${{ github.run_number }}-metadata
          path: |
            dist/england-routing/admins.sqlite
            dist/england-routing/timezones.sqlite
            dist/england-routing/valhalla.json
            dist/england-routing/england-routing.manifest.json
            dist/england-routing/england-routing.metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Explain why publication is gated
        if: inputs.publish_release && (!inputs.licence_review_confirmed || !inputs.independent_validation_confirmed)
        run: echo "Publication skipped: both human licence review and independent clean-machine validation must be confirmed."
      - name: Prepare release version
        id: version
        if: inputs.publish_release && inputs.licence_review_confirmed && inputs.independent_validation_confirmed
        shell: bash
        run: |
          version="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish verified routing assets
        if: inputs.publish_release && inputs.licence_review_confirmed && inputs.independent_validation_confirmed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: england-routing-data-${{ steps.version.outputs.version }}
          name: TomOS Maps England Valhalla routing test data ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dist/england-routing/*
