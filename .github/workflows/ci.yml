name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-and-shared:
    name: Shared core and Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Run shared tests
        run: gradle :composeApp:desktopTest
      - name: Build Linux desktop distribution
        run: gradle :composeApp:packageDistributionForCurrentOS
      - name: Upload Linux desktop app image
        uses: actions/upload-artifact@v4
        with:
          name: tomos-maps-linux-x86_64
          path: composeApp/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build Android debug APK
        run: gradle :androidApp:assembleDebug
      - name: Upload Android testing APK
        uses: actions/upload-artifact@v4
        with:
          name: tomos-maps-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
