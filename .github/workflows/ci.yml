name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-package-builder:
    name: Regional package builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate regional build scripts
        run: |
          bash -n tools/build-valhalla-region.sh && bash -n tools/build-liverpool-region.sh && bash -n tools/test-local-valhalla-route.sh
          python3 -m pip install --disable-pip-version-check pyproj
          python3 -m py_compile tools/package-regional-data.py tools/build-signed-catalogue.py tools/download-codepoint-open.py tools/prepare-codepoint-open.py
      - name: Test regional package creation
        run: python3 -m unittest discover -s tools/tests -v

  desktop-and-shared:
    name: Shared core and Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Run shared tests
        run: gradle :composeApp:desktopTest
      - name: Build Linux desktop distribution
        run: gradle :composeApp:createDistributable :composeApp:packageDistributionForCurrentOS
      - name: Upload Linux desktop app image
        uses: actions/upload-artifact@v4
        with:
          name: tomos-maps-linux-x86_64
          path: composeApp/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build Android debug APK
        run: gradle :androidApp:assembleDebug
      - name: Upload Android testing APK
        uses: actions/upload-artifact@v4
        with:
          name: tomos-maps-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-android-testing-release:
    name: Publish Android testing release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop-and-shared, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android testing APK
        uses: actions/download-artifact@v4
        with:
          name: tomos-maps-android-debug-apk
          path: release-assets
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing-0.2.0-build-${{ github.run_number }}
          name: TomOS Maps 0.2.0 testing build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*.apk
