name: Liverpool offline navigation end-to-end

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/liverpool-offline-e2e.yml"
      - "tools/build-liverpool-region.sh"
      - "tools/build-valhalla-region.sh"
      - "tools/test-local-valhalla-route.sh"
      - "tools/download-codepoint-open.py"
      - "tools/prepare-codepoint-open.py"
      - "tools/download-offline-map-glyphs.sh"
      - "tools/package-regional-data.py"
      - "composeApp/build.gradle.kts"
      - "composeApp/src/commonMain/kotlin/uk/co/tomosmaps/App.kt"
      - "composeApp/src/**/RegionalOfflineMapStyle.kt"
      - "composeApp/src/**/PlatformOfflineValhallaRuntime.kt"
      - "androidApp/build.gradle.kts"
      - "androidApp/src/androidTest/**"

permissions:
  contents: read

jobs:
  build-liverpool-region:
    name: Build real Liverpool offline datasets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install postcode conversion and OSM PBF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --disable-pip-version-check pyproj
      - name: Build maps, postcode index and Valhalla graph
        run: bash tools/build-liverpool-region.sh
      - name: Validate package builder and publisher scripts
        run: |
          python -m py_compile tools/package-regional-data.py tools/build-signed-catalogue.py tools/download-codepoint-open.py tools/prepare-codepoint-open.py
          python -m unittest discover -s tools/tests -v
      - name: Stage stable package artifact name
        run: |
          mkdir -p build-artifacts
          archive="$(find dist/liverpool -maxdepth 1 -type f -name 'liverpool-city-region-*.zip' -print -quit)"
          test -n "$archive"
          cp "$archive" build-artifacts/liverpool-region.zip
          cp "${archive%.zip}.manifest.json" build-artifacts/liverpool-region.manifest.json
          cp "${archive%.zip}.metadata.json" build-artifacts/liverpool-region.metadata.json
          sha256sum build-artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: liverpool-offline-package
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 30

  android-offline-navigation:
    name: Android native Valhalla with internet disabled
    needs: build-liverpool-region
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - uses: actions/download-artifact@v4
        with:
          name: liverpool-offline-package
          path: build-artifacts
      - name: Add generated Liverpool package to instrumentation test assets
        run: |
          mkdir -p androidApp/src/androidTest/assets
          cp build-artifacts/liverpool-region.zip androidApp/src/androidTest/assets/liverpool-region.zip
          cp build-artifacts/liverpool-region.manifest.json androidApp/src/androidTest/assets/liverpool-region.manifest.json
          cp build-artifacts/liverpool-region.metadata.json androidApp/src/androidTest/assets/liverpool-region.metadata.json
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
